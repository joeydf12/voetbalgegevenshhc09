name: Wekelijkse update Hollandse Velden
on:
  schedule:
    - cron: '17 6 * * 1'   # maandag ~07:17/08:17 NL
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch-hv.mjs
      - run: node scripts/validate.mjs
      - run: npm test
      - name: Commit als er iets veranderd is
        run: |
          git config user.name "hhc09-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Wekelijkse update Hollandse Velden" && git push)
